<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 🎂</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 50px;
      color: #fff;
    }
    p {
      font-size: 22px;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.2);
      padding: 30px;
      border-radius: 20px;
      width: 80%;
      max-width: 500px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Happy Birthday 🎉</h1>
    <p>Dear <b>Shiva</b>,</p>
    <p>
      Wishing you a day filled with happiness,<br>
      joy, and lots of cake! 🎂🥳
    </p>
    <p>Have a wonderful year ahead! 💖</p>
  </div>
</body>
</html>
